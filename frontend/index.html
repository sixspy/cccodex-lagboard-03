<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>源到达SLA</title>
<script src="/static/vue.global.prod.js"></script>
<style>
  :root{--bg:#eef3f8;--card:#fff;--ink:#142033;--line:#d5dee8;--blue:#2563eb;--warn:#d97706;--bad:#dc2626;--ok:#059669}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  aside{background:#10233f;color:#e7eefc;padding:22px 18px}
  aside h1{font-family:"Segoe UI",system-ui,sans-serif;font-size:28px;margin:0 0 6px}
  aside p{color:#9db0cc;font-size:13px;line-height:1.5;margin:0 0 18px}
  .src{background:#173054;border:1px solid #274872;border-radius:12px;padding:12px;margin-bottom:10px}
  .src b{display:block;font-size:15px}
  .src span{font-size:12px;color:#9db0cc}
  .mode{margin-top:8px;display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#1d3b66}
  .mode.bad{background:#5b1d1d}.mode.warn{background:#5b4012}.mode.ok{background:#134e3a}
  .tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;font-size:11px;background:#7c2d12;color:#fff}
  main{padding:20px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:transparent;padding:9px 12px;cursor:pointer}
  .seg button.on{background:var(--blue);color:#fff}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h3{margin:0;font-size:12px;color:#64748b;font-weight:500}
  .card strong{display:block;font-family:"Segoe UI",system-ui,sans-serif;font-size:28px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:5px 0 10px}
  .primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
  .ghost{background:#fff;border:1px solid #334155;color:#334155;border-radius:8px;padding:6px 8px;cursor:pointer}
  .ghost.danger{border-color:var(--bad);color:var(--bad)}
  .ghost.warnb{border-color:var(--warn);color:var(--warn)}
  .login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  .err{color:var(--bad);min-height:18px}
  .timeline{border-left:2px solid #cbd5e1;margin-left:8px;padding-left:14px}
  .timeline .item{margin-bottom:12px;position:relative}
  .timeline .item:before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .muted{color:#64748b;font-size:12px}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#e2e8f0;color:#334155}
  .badge.bad{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}
  .badge.ok{background:#d1fae5;color:#065f46}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;background:#b91c1c;color:#fff">需要启用 JavaScript</p></noscript>
<div id="boot-hint" style="display:none;padding:24px;font-family:sans-serif;background:#fef3c7;color:#111">页面脚本未加载。请确认可访问 /static/vue.global.prod.js</div>
<script>
setTimeout(function () {
  if (!window.Vue) {
    var e = document.getElementById("boot-hint");
    if (e) e.style.display = "block";
  }
}, 800);
</script>

<script>
const {createApp,ref,onMounted,computed}=Vue;
createApp({
  setup(){
    const token=ref(localStorage.getItem('lagboard_token')||'');
    const user=ref(localStorage.getItem('lagboard_user')||'');
    const username=ref('admin'), password=ref('123456'), err=ref(''), tab=ref(0), actionErr=ref('');
    const board=ref({sources:[],arrivals:[],policy:[],catchup_queue:[],watermarks:{sources:0,frozen:0,degraded:0,pending:0}});
    const sources=computed(()=>board.value.sources||[]);
    const arrivals=computed(()=>board.value.arrivals||[]);
    const policy=computed(()=>board.value.policy||[]);
    const catchups=computed(()=>board.value.catchup_queue||[]);
    const wm=computed(()=>board.value.watermarks||{});
    const form=ref({source:'订单源', source_clock:'2026-11-16T10:00:00', ingest_clock:'2026-11-16T10:40:00'});
    const nav=['到达详情','策略附页','补采队列'];
    const frozen=computed(()=>wm.value.frozen||0);
    const degraded=computed(()=>wm.value.degraded||0);
    const pending=computed(()=>wm.value.pending||0);
    function modeClass(m){return m==='冻结'?'bad':(m==='降级只读'?'warn':'ok');}
    function auth(){return {Authorization:'Bearer '+token.value,'Content-Type':'application/json'};}
    async function login(){
      err.value='';
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});
      const j=await r.json(); if(!r.ok){err.value=j.detail||'登录失败';return;}
      token.value=j.token; user.value=j.username;
      localStorage.setItem('lagboard_token',j.token); localStorage.setItem('lagboard_user',j.username);
      await refresh();
    }
    function logout(){token.value='';user.value='';localStorage.removeItem('lagboard_token');localStorage.removeItem('lagboard_user');}
    async function loadJson(url){
      const r=await fetch(url,{headers:auth()});
      const j=await r.json().catch(()=>({}));
      if(r.status===401){ logout(); return null; }
      return j;
    }
    async function refresh(){
      if(!token.value) return;
      const b=await loadJson('/api/board'); if(b===null) return;
      board.value=b;
      if(sources.value.length && !form.value.source) form.value.source=sources.value[0].name;
    }
    async function recordArrival(){
      actionErr.value='';
      const r=await fetch('/api/arrivals',{method:'POST',headers:auth(),body:JSON.stringify(form.value)});
      const j=await r.json();
      actionErr.value=r.ok
        ?(`滞后 ${j.lag_minutes} 分 · ${j.level} · 要求 ${j.required_mode} · 当前 ${j.output_mode}`+(j.pending?' · 待处置':''))
        :(j.detail||'失败');
      await refresh();
    }
    async function dispose(name, kind){
      actionErr.value='';
      const r=await fetch('/api/dispositions',{method:'POST',headers:auth(),body:JSON.stringify({source:name,kind:kind,operator:user.value})});
      const j=await r.json();
      actionErr.value=r.ok?(`处置已落定：${name} → ${j.output_mode}（路径 ${j.path}）`):(j.detail||j.code||'处置失败');
      await refresh();
    }
    async function resumeAll(){
      actionErr.value='';
      const r=await fetch('/api/dispositions/resume',{method:'POST',headers:auth()});
      const j=await r.json();
      actionErr.value=(j.resumed&&j.resumed.length)?`已续推 ${j.resumed.length} 笔`:(j.failed&&j.failed.length?'续推仍有失败':'无待续推意图');
      await refresh();
    }
    async function doCatchup(name){
      actionErr.value='';
      const r=await fetch('/api/catchup/'+encodeURIComponent(name),{method:'POST',headers:auth()});
      const j=await r.json(); if(!r.ok) actionErr.value=j.detail||'补齐失败';
      await refresh();
    }
    onMounted(()=>{if(token.value)refresh();});
    return {token,user,username,password,err,tab,nav,sources,arrivals,policy,catchups,wm,form,actionErr,
            frozen,degraded,pending,modeClass,login,logout,recordArrival,dispose,resumeAll,doCatchup};
  },
  template:`
  <div v-if="!token" class="login">
    <h1 style="margin:0 0 8px">源到达SLA</h1>
    <p style="color:#64748b">多源到达时钟对照 SLA，超限冻结或降级，补齐后恢复。</p>
    <label>用户名</label><input v-model="username"/><label>密码</label><input type="password" v-model="password"/>
    <div class="err">{{err}}</div><button class="primary" style="width:100%" @click="login">打开监控面</button>
  </div>
  <div v-if="token" class="wrap">
    <aside>
      <h1>源到达SLA</h1>
      <p>左侧是源目录当前输出态（与右侧策略附页、到达详情、补采队列、水位卡片同态）。</p>
      <div class="src" v-for="s in sources" :key="s.id">
        <b>{{s.name}}</b>
        <span>SLA {{s.sla_minutes}} 分钟</span>
        <div class="mode" :class="modeClass(s.output_mode)">{{s.output_mode}}</div>
        <span v-if="s.pending" class="tag">待处置 → {{s.required_mode}}</span>
      </div>
      <div style="margin-top:18px;font-size:12px;color:#9db0cc">{{user}} · <a href="#" style="color:#fff" @click.prevent="logout">退出</a></div>
    </aside>
    <main>
      <div class="bar">
        <div class="seg"><button v-for="(n,i) in nav" :key="n" :class="{on:tab===i}" @click="tab=i">{{n}}</button></div>
        <button class="ghost" @click="resumeAll">续推待落库处置</button>
      </div>
      <div class="cards">
        <div class="card"><h3>源数量</h3><strong>{{wm.sources||0}}</strong></div>
        <div class="card"><h3>冻结中</h3><strong>{{frozen}}</strong></div>
        <div class="card"><h3>降级只读</h3><strong>{{degraded}}</strong></div>
        <div class="card"><h3>待处置</h3><strong>{{pending}}</strong></div>
      </div>
      <div class="card" v-show="tab===0">
        <h3 style="margin-bottom:8px">登记到达（采集入库）</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
          <div><label>源</label><select v-model="form.source"><option v-for="s in sources" :value="s.name">{{s.name}}</option></select></div>
          <div><label>源时钟</label><input v-model="form.source_clock"/></div>
          <div><label>摄入时钟</label><input v-model="form.ingest_clock"/></div>
        </div>
        <button class="primary" @click="recordArrival">登记分级（不改输出态）</button>
        <div class="err">{{actionErr}}</div>
        <h3 style="margin:16px 0 8px">到达详情</h3>
        <table><thead><tr><th>源</th><th>滞后</th><th>级别</th><th>当前输出态</th><th>时钟</th></tr></thead>
        <tbody><tr v-for="a in arrivals" :key="a.id">
          <td>{{a.source}}</td><td>{{a.lag_minutes}} 分</td><td>{{a.level}}</td>
          <td><span class="badge" :class="modeClass(a.effective_mode)">{{a.effective_mode}}</span></td>
          <td class="muted">{{a.source_clock}} → {{a.ingest_clock}}</td>
        </tr></tbody></table>
      </div>
      <div class="card" v-show="tab===1">
        <h3>策略附页</h3>
        <p class="muted">≤SLA 正常可写；≤2×SLA 告警降级只读；更久违约冻结。超限处置只能冻结或降级只读之一，须与要求同态。</p>
        <table><thead><tr><th>源</th><th>SLA</th><th>要求输出态</th><th>当前输出态</th><th>处置</th></tr></thead>
        <tbody><tr v-for="s in policy" :key="'g'+s.source">
          <td>{{s.source}}</td><td>{{s.sla_minutes}}</td>
          <td><span class="badge" :class="modeClass(s.required_mode)">{{s.required_mode}}</span></td>
          <td><span class="badge" :class="modeClass(s.output_mode)">{{s.output_mode}}</span></td>
          <td>
            <button v-if="s.required_mode==='冻结'" class="ghost danger" @click="dispose(s.source,'冻结')">冻结</button>
            <button v-if="s.required_mode==='降级只读'" class="ghost warnb" @click="dispose(s.source,'降级只读')">降级只读</button>
            <button v-if="s.required_mode==='可写'" class="ghost" @click="doCatchup(s.source)">补齐恢复</button>
          </td>
        </tr></tbody></table>
      </div>
      <div class="card" v-show="tab===2">
        <h3>补采队列</h3>
        <table><thead><tr><th>源</th><th>当前输出态</th><th>待处置</th><th>需补齐</th><th>最近补齐</th></tr></thead>
        <tbody><tr v-for="x in catchups" :key="'q'+x.source">
          <td>{{x.source}}</td>
          <td><span class="badge" :class="modeClass(x.effective_mode)">{{x.effective_mode}}</span></td>
          <td><span v-if="x.pending" class="badge warn">→ {{x.required_mode}}</span><span v-else class="muted">否</span></td>
          <td>{{x.needs_catchup ? '是' : '否'}}</td>
          <td class="muted">{{x.last_status ? (x.last_status + ' · ' + x.last_created_at) : '暂无'}}</td>
        </tr></tbody></table>
        <p v-if="!catchups.length" class="muted">暂无补采记录。</p>
      </div>
    </main>
  </div>`
}).mount('#app');
</script>
</body>
</html>
